<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apizza Tech Systems — Sign Controller</title>
<style>
  :root{
    --chrome:#D4D0C8;
    --chrome-lt:#ECE9D8;
    --white:#FFFFFF;
    --black:#000000;
    --navy1:#0A317E;
    --navy2:#0A246A;
    --text:#000000;
    --text-dim:#4A4A4A;
    --amber:#FFB100;
    --amber-glow:rgba(255,177,0,.9);
    --led-off:rgba(255,177,0,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--chrome);color:var(--text);
    font-family:Tahoma,'MS Sans Serif',Geneva,sans-serif;font-size:11px;overflow:hidden;}
  .mono{font-family:'Courier New',monospace;}

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed;inset:0;background:#000;z-index:100;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .7s ease;
  }
  #splash.hide{opacity:0;pointer-events:none;}
  #splash img{width:min(64vw,560px);opacity:0;
    animation:logoIn 1.3s ease forwards;}
  @keyframes logoIn{ to{opacity:1;} }

  /* ---------- APP SHELL ---------- */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s ease;}
  #app.show{opacity:1;}

  /* menu bar */
  #menubar{height:22px;flex:none;display:flex;align-items:center;background:var(--chrome);
    border-bottom:1px solid #808080;padding:0 4px;}
  .menu-item{padding:2px 8px;cursor:default;}
  .menu-item:hover{background:var(--navy2);color:#fff;}

  /* toolbar / header */
  #toolbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;
    padding:0 10px;background:var(--chrome);border-bottom:1px solid #808080;
    box-shadow:inset 0 1px 0 #fff;}
  #toolbar img{height:26px;image-rendering:auto;}
  #toolbar .title-block{display:flex;flex-direction:column;line-height:1.15;}
  #toolbar .app-title{font-weight:bold;font-size:12px;}
  #toolbar .app-sub{font-size:10px;color:var(--text-dim);}
  #toolbar .spacer{flex:1;}
  .status-box{
    display:flex;align-items:center;gap:6px;padding:3px 10px;
    background:var(--white);border:1px inset var(--chrome);font-size:10px;font-family:'Courier New',monospace;
  }
  .status-dot{width:7px;height:7px;background:#00A000;border:1px solid #005000;animation:blinkdot 1.6s steps(1) infinite;}
  @keyframes blinkdot{0%,60%{opacity:1;}61%,100%{opacity:.3;}}

  #content{flex:1;overflow:auto;padding:14px;background:var(--chrome-lt);}
  .view{display:none;max-width:1080px;margin:0 auto;}
  .view.active{display:block;}

  /* group boxes = fieldsets, native groove look */
  fieldset{border:2px groove var(--chrome);border-radius:0;margin:0 0 14px 0;padding:12px 14px 14px;background:var(--chrome-lt);}
  legend{font-weight:bold;font-size:11px;padding:0 5px;}

  #sign-shell{
    background:#000;border:2px inset var(--chrome);
    padding:20px 18px;display:flex;align-items:center;justify-content:center;
  }
  #ledCanvas{image-rendering:pixelated;width:100%;max-width:1000px;height:auto;display:block;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:820px){.grid2{grid-template-columns:1fr;}}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;font-weight:bold;margin-bottom:5px;}
  textarea, select, input[type=text]{
    width:100%;background:var(--white);border:1px inset var(--chrome);
    color:var(--text);font-family:'Courier New',monospace;font-size:12px;padding:5px 6px;resize:none;
  }
  textarea:focus, select:focus{outline:1px dotted #000;}
  textarea{height:40px;}

  .row{display:flex;gap:8px;align-items:center;}
  .checkrow{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .checkrow input{width:14px;height:14px;}
  .checkrow label{font-weight:bold;font-size:11px;}

  input[type=range]{width:100%;}
  .val{font-family:'Courier New',monospace;font-size:11px;min-width:30px;text-align:right;}

  .btn{
    background:var(--chrome);border:2px outset var(--chrome);color:var(--text);
    font-family:Tahoma;font-size:11px;font-weight:bold;
    padding:6px 16px;cursor:pointer;
  }
  .btn:active{border-style:inset;}
  .btn.primary{font-weight:bold;}
  .btn-row{display:flex;gap:8px;margin-top:12px;}

  .swatches{display:flex;gap:6px;}
  .swatch{width:22px;height:22px;border:2px outset var(--chrome);cursor:pointer;}
  .swatch.selected{border-style:inset;}

  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .preset-chip{
    background:var(--chrome);border:1px outset var(--chrome);color:var(--text);
    font-family:'Courier New',monospace;font-size:10.5px;padding:4px 9px;cursor:pointer;
  }
  .preset-chip:active{border-style:inset;}

  #statusbar{
    flex:none;height:22px;display:flex;align-items:center;gap:16px;padding:0 10px;
    background:var(--chrome);border-top:1px solid #fff;box-shadow:inset 0 1px 0 #808080;
    font-size:10px;color:var(--text-dim);font-family:'Courier New',monospace;
  }
  #statusbar .sep{width:1px;height:12px;background:#808080;box-shadow:1px 0 0 #fff;}
</style>
</head>

<script>
/* ============ SPLASH SEQUENCE ============ */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').classList.add('show');
    startClock();
  }, 6000);
});

function startClock(){
  const start = Date.now();
  const el = document.getElementById('clockStatus');
  setInterval(() => {
    const s = Math.floor((Date.now()-start)/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    el.textContent = `UPTIME: ${hh}:${mm}:${ss}`;
  }, 1000);
}

/* ============ MENU (File > Exit) ============ */
document.getElementById('menuFile').addEventListener('click', ()=>{
  if(window.pywebview){ window.pywebview.api && window.pywebview.api.exit_app && window.pywebview.api.exit_app(); }
});

/* ============ LED MATRIX ENGINE ============ */
const COLS = 126, ROWS = 19;
const canvas = document.getElementById('ledCanvas');
const ctx = canvas.getContext('2d');
const CELL = canvas.width / COLS;

const COLORS = {
  amber: {on:'#FFB100', glow:'rgba(255,177,0,.9)'},
  red:   {on:'#FF3B30', glow:'rgba(255,59,48,.9)'},
  green: {on:'#39FF6A', glow:'rgba(57,255,106,.9)'},
  white: {on:'#F5F5F5', glow:'rgba(245,245,245,.9)'}
};
let currentColor = 'amber';

const swatchWrap = document.getElementById('colorSwatches');
Object.keys(COLORS).forEach((key)=>{
  const d = document.createElement('div');
  d.className = 'swatch'+(key==='amber'?' selected':'');
  d.style.background = COLORS[key].on;
  d.addEventListener('click', ()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
    d.classList.add('selected');
    currentColor = key;
  });
  swatchWrap.appendChild(d);
});

/* presets: {line1, line2} */
const PRESETS = [
  {l1:"WELCOME TO APIZZA TECH", l2:""},
  {l1:"5 BILLINGS BRIDGE", l2:""},
  {l1:"168 BRIDLEWOOD", l2:"STITTSVILLE-KANATA"},
  {l1:"19 ST-LAURENT", l2:""},
  {l1:"OUT OF SERVICE", l2:""},
  {l1:"NOT IN SERVICE", l2:""},
  {l1:"SORRY BUS FULL", l2:""},
  {l1:"SPECIAL EVENT", l2:"SEE OPERATOR"}
];
const presetWrap = document.getElementById('presetList');
PRESETS.forEach(p=>{
  const c = document.createElement('div');
  c.className = 'preset-chip';
  c.textContent = p.l1 + (p.l2 ? ' / '+p.l2 : '');
  c.addEventListener('click', ()=>{
    document.getElementById('msgInput').value = p.l1 + (p.l2 ? ' - '+p.l2 : '');
    document.getElementById('msgInputL1').value = p.l1;
    document.getElementById('msgInputL2').value = p.l2;
    rebuildAll();
  });
  presetWrap.appendChild(c);
});

/* ---- line mode toggle ---- */
const lineModeSelect = document.getElementById('lineModeSelect');
const oneLineField = document.getElementById('oneLineField');
const twoLineField1 = document.getElementById('twoLineField1');
const twoLineField2 = document.getElementById('twoLineField2');
lineModeSelect.addEventListener('change', ()=>{
  const two = lineModeSelect.value==='two';
  oneLineField.style.display = two ? 'none' : '';
  twoLineField1.style.display = two ? '' : 'none';
  twoLineField2.style.display = two ? '' : 'none';
  rebuildAll();
});

/* ---- render text to a boolean bitmap for a given pixel-row height ---- */
function renderTextBitmap(text, rowHeight, fontWeight){
  text = (text || " ").toUpperCase();
  const SS = 10;
  const fontPxRows = Math.max(4, rowHeight - (rowHeight>12?3:1));
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');
  offCtx.font = `${fontWeight} ${fontPxRows*SS}px Verdana, Geneva, sans-serif`;
  const textWidthPx = Math.ceil(offCtx.measureText(text).width / SS) + 4;

  off.width = Math.max(1,textWidthPx) * SS;
  off.height = rowHeight * SS;
  offCtx.font = `${fontWeight} ${fontPxRows*SS}px Verdana, Geneva, sans-serif`;
  offCtx.fillStyle = '#fff';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, SS*1, (rowHeight*SS)/2 + SS*0.5);

  const imgData = offCtx.getImageData(0,0,off.width,off.height).data;
  const bitmap = [];
  const threshold = fontWeight >= 700 ? 90 : 140;
  for(let r=0;r<rowHeight;r++){
    const row = [];
    for(let c=0;c<textWidthPx;c++){
      let hit = false;
      const sx = c*SS, sy = r*SS;
      for(let yy=0; yy<SS && !hit; yy+=2){
        for(let xx=0; xx<SS && !hit; xx+=2){
          const px = (sx+xx), py=(sy+yy);
          if(px>=off.width||py>=off.height) continue;
          const idx = (py*off.width+px)*4;
          if(imgData[idx+3] > threshold) hit = true;
        }
      }
      row.push(hit?1:0);
    }
    bitmap.push(row);
  }
  return {bitmap, width: textWidthPx};
}

/* ---- state ---- */
let L1 = {bitmap:[], width:0, scrollX:COLS};
let L2 = {bitmap:[], width:0, scrollX:COLS};
let CLK = {bitmap:[], width:0, text:''};
let blinkOn = true;

function getFontWeight(){
  return document.getElementById('fontStyleSelect').value === 'bold' ? 900 : 400;
}

function rebuildAll(){
  const mode = lineModeSelect.value;
  const fw = getFontWeight();
  if(mode==='one'){
    const r = renderTextBitmap(document.getElementById('msgInput').value, 16, fw);
    L1 = {bitmap:r.bitmap, width:r.width, scrollX:COLS};
    L2 = {bitmap:[], width:0, scrollX:COLS};
  } else {
    const r1 = renderTextBitmap(document.getElementById('msgInputL1').value, 8, fw);
    const r2 = renderTextBitmap(document.getElementById('msgInputL2').value, 8, fw);
    L1 = {bitmap:r1.bitmap, width:r1.width, scrollX:COLS};
    L2 = {bitmap:r2.bitmap, width:r2.width, scrollX:COLS};
  }
}

function updateClockBitmap(rowHeight){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const text = `${hh}:${mm}`;
  if(text !== CLK.text){
    const r = renderTextBitmap(text, rowHeight, 700);
    CLK = {bitmap:r.bitmap, width:r.width, text};
  }
}

/* ---- drawing a bitmap region into the main canvas ---- */
function drawBitmapRegion(bmp, bmpWidth, rowOffset, rowHeight, colStart, colWidth, scrollOffsetCol, color, brightness){
  for(let r=0;r<rowHeight;r++){
    for(let c=0;c<colWidth;c++){
      const realCol = c - scrollOffsetCol;
      if(realCol<0 || realCol>=bmpWidth) continue;
      if(!bmp[r] || !bmp[r][realCol]) continue;
      const gridCol = colStart + c;
      const gridRow = rowOffset + r;
      if(gridCol<0 || gridCol>=COLS || gridRow<0 || gridRow>=ROWS) continue;
      const cx = gridCol*CELL + CELL/2;
      const cy = gridRow*CELL + CELL/2;
      ctx.beginPath();
      ctx.arc(cx,cy,CELL*0.4,0,Math.PI*2);
      ctx.fillStyle = color.on;
      ctx.globalAlpha = brightness;
      ctx.shadowColor = color.glow;
      ctx.shadowBlur = CELL*0.9*brightness;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }
}

function drawFrame(){
  const brightness = document.getElementById('brightRange').value/100;
  const effect = document.getElementById('effectSelect').value;
  const mode = lineModeSelect.value;
  const showClock = document.getElementById('clockCheck').checked;
  const col = COLORS[currentColor];

  ctx.clearRect(0,0,canvas.width,canvas.height);
  // unlit dot background
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cx = c*CELL + CELL/2, cy = r*CELL + CELL/2;
      ctx.beginPath();
      ctx.arc(cx,cy,CELL*0.36,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,177,0,0.06)';
      ctx.fill();
    }
  }

  const showLit = effect==='blink' ? blinkOn : true;
  if(!showLit) return;

  if(mode==='one'){
    let clockCols = 0;
    if(showClock){
      updateClockBitmap(16);
      clockCols = CLK.width + 4;
      drawBitmapRegion(CLK.bitmap, CLK.width, 2, 16, COLS-CLK.width, CLK.width, 0, col, brightness);
    }
    const avail = COLS - clockCols;
    let offset;
    if(effect==='scroll') offset = Math.floor(L1.scrollX);
    else offset = -Math.floor((L1.width-avail)/2);
    drawBitmapRegion(L1.bitmap, L1.width, 2, 16, 0, avail, offset, col, brightness);
  } else {
    // two line: band1 rows 0-8, band2 rows 10-18
    let clockCols = 0;
    if(showClock){
      updateClockBitmap(8);
      clockCols = CLK.width + 3;
      drawBitmapRegion(CLK.bitmap, CLK.width, 0, 8, COLS-CLK.width, CLK.width, 0, col, brightness);
    }
    const avail1 = COLS - clockCols;
    let off1, off2;
    if(effect==='scroll'){ off1 = Math.floor(L1.scrollX); off2 = Math.floor(L2.scrollX); }
    else { off1 = -Math.floor((L1.width-avail1)/2); off2 = -Math.floor((L2.width-COLS)/2); }
    drawBitmapRegion(L1.bitmap, L1.width, 0, 8, 0, avail1, off1, col, brightness);
    drawBitmapRegion(L2.bitmap, L2.width, 10, 9, 0, COLS, off2, col, brightness);
  }
}

let lastTime = 0;
function animate(t){
  const speed = document.getElementById('speedRange').value/100;
  const effect = document.getElementById('effectSelect').value;
  if(!lastTime) lastTime = t;
  const dt = t - lastTime;

  if(effect==='scroll'){
    if(dt > (30 - speed*25)){
      L1.scrollX -= 1;
      if(L1.scrollX < -L1.width) L1.scrollX = COLS;
      L2.scrollX -= 1;
      if(L2.scrollX < -L2.width) L2.scrollX = COLS;
      lastTime = t;
    }
  } else if(effect==='blink'){
    if(dt > 500){ blinkOn = !blinkOn; lastTime = t; }
  }
  drawFrame();
  requestAnimationFrame(animate);
}

/* ---- wire up inputs ---- */
['msgInput','msgInputL1','msgInputL2'].forEach(id=>{
  document.getElementById(id).addEventListener('input', rebuildAll);
});
document.getElementById('fontStyleSelect').addEventListener('change', rebuildAll);
document.getElementById('applyBtn').addEventListener('click', rebuildAll);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('msgInput').value = '';
  document.getElementById('msgInputL1').value = '';
  document.getElementById('msgInputL2').value = '';
  rebuildAll();
});
document.getElementById('speedRange').addEventListener('input', e=>{
  document.getElementById('speedVal').textContent = e.target.value;
});
document.getElementById('brightRange').addEventListener('input', e=>{
  document.getElementById('brightVal').textContent = e.target.value;
});
document.getElementById('effectSelect').addEventListener('change', ()=>{ L1.scrollX = COLS; L2.scrollX = COLS; });
document.getElementById('clockCheck').addEventListener('change', rebuildAll);

rebuildAll();
requestAnimationFrame(animate);
</script>
